name: Build iOS Agent Sandbox (from ZIP, 2-file repo)

# ใช้เมื่อ "ไม่อยากอัปไฟล์ 30+ ไฟล์ขึ้น GitHub" (เช่น ทำจากมือถือ)
# วิธีนี้ใช้แค่ 2 ไฟล์ใน repo:
#   1) iOSAgentSandbox-source.zip   ← อัปโหลดผ่านหน้าเว็บ (Add file → Upload files)
#   2) .github/workflows/build.yml  ← สร้างใหม่แล้ววางเนื้อหาไฟล์นี้
# แล้วกด Run workflow (หรือ push) — CI จะแตก zip, รันเทสต์, build, เซ็น ldid และเผยแพร่ .ipa ขึ้น Releases
#
# workflow นี้ทำงานได้ทั้งกรณี:
#   • อัปแค่ zip (แตกไฟล์เอง)                                  → ใช้ได้
#   • อัปโปรเจกต์แบบแตกไฟล์ครบทุกไฟล์ (มี project.yml ที่ root) → ใช้ได้เหมือนกัน

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Unzip + Build + ldid + IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: เตรียมซอร์สโค้ด (แตกไฟล์ zip ที่อัปโหลด หรือใช้โปรเจกต์ที่มีอยู่)
        id: source
        run: |
          set -euo pipefail
          if [ -f project.yml ]; then
            echo "ใช้โปรเจกต์ที่มีอยู่ที่ root ของเรพ"
            echo "dir=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ZIP="$(ls -1 *.zip 2>/dev/null | head -1 || true)"
          if [ -z "$ZIP" ]; then
            echo "::error title=ไม่พบซอร์สโค้ด::ไม่พบทั้ง project.yml และไฟล์ .zip ในเรพ — อัปโหลด iOSAgentSandbox-source.zip หรือไฟล์โปรเจกต์ให้ครบ"
            exit 1
          fi

          echo "แตกไฟล์: $ZIP"
          mkdir -p src
          unzip -q -o "$ZIP" -d src
          ls -1 src | sed 's/^/  /'

          MANIFEST="$(find src -maxdepth 3 -name project.yml -print -quit)"
          if [ -z "$MANIFEST" ]; then
            echo "::error title=zip ไม่ถูกต้อง::ไม่พบ project.yml ในไฟล์ zip"
            exit 1
          fi
          DIR="$(dirname "$MANIFEST")"
          echo "พบโปรเจกต์ที่: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: เลือก Xcode ใหม่สุดที่ยังรองรับ deployment target iOS 15.0
        env:
          PROJECT_DIR: ${{ steps.source.outputs.dir }}
        run: |
          printf 'import UIKit\n' > /tmp/probe.swift
          python3 "$PROJECT_DIR/Scripts/ci/pick-xcode.py" > /tmp/xcode-candidates.txt || true
          cat /tmp/xcode-candidates.txt || true

          chosen=""
          while IFS=$'\t' read -r app version; do
            [ -d "$app" ] || continue
            if sudo xcode-select -s "$app" >/dev/null 2>&1; then
              sdk="$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || true)"
              if [ -n "$sdk" ] && swiftc -target arm64-apple-ios15.0 -sdk "$sdk" -typecheck /tmp/probe.swift >/dev/null 2>&1; then
                chosen="$app"
                echo "เลือกใช้: $app (Xcode $version)"
                break
              fi
              echo "  ข้าม Xcode $version — คอมไพล์ให้ iOS 15.0 ไม่ได้"
            fi
          done < /tmp/xcode-candidates.txt

          [ -n "$chosen" ] || echo "::warning title=ไม่พบ Xcode ที่รองรับ iOS 15.0::จะใช้ค่าเริ่มต้นของ runner"
          xcodebuild -version

      - name: ตรวจความเข้ากันได้กับ iOS 15
        env:
          PROJECT_DIR: ${{ steps.source.outputs.dir }}
        run: cd "$PROJECT_DIR" && bash Scripts/check-ios15-compat.sh .

      - name: รัน unit test ของแกนกลาง (33 เคส)
        env:
          PROJECT_DIR: ${{ steps.source.outputs.dir }}
        run: cd "$PROJECT_DIR" && bash verification/run-verification.sh

      - name: รัน E2E กับเซิร์ฟเวอร์ OpenRouter จำลอง
        env:
          PROJECT_DIR: ${{ steps.source.outputs.dir }}
        run: cd "$PROJECT_DIR" && bash verification/e2e/run-e2e.sh

      - name: ติดตั้ง XcodeGen และ ldid
        run: |
          set -uo pipefail
          brew install xcodegen || (brew update && brew install xcodegen) || true
          if brew install ldid-procursus; then
            echo "ติดตั้ง ldid (procursus) สำเร็จ"
          elif brew install ldid; then
            echo "ติดตั้ง ldid (saurik) สำเร็จ"
          else
            echo "::warning title=ติดตั้ง ldid ไม่ได้::จะใช้ codesign ad-hoc แทน"
          fi
          if command -v ldid >/dev/null 2>&1; then
            ldid --version 2>&1 | head -2 || true   # ldid --version คืน exit 1 จึงต้องกันไว้
          fi

      - name: สร้างโปรเจกต์ Xcode + Build แบบไม่ลงนาม
        env:
          PROJECT_DIR: ${{ steps.source.outputs.dir }}
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          xcodegen generate
          PBX="iOSAgentSandbox.xcodeproj/project.pbxproj"
          XCODE_MAJOR="$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)"
          if [ "${XCODE_MAJOR:-0}" -lt 16 ] 2>/dev/null && grep -q "objectVersion = 77" "$PBX" 2>/dev/null; then
            sed -i '' 's/objectVersion = 77;/objectVersion = 60;/' "$PBX"
            sed -i '' '/preferredProjectObjectVersion = 77;/d' "$PBX" || true
            echo "ปรับ project format 77 → 60 ให้เปิดได้กับ Xcode $XCODE_MAJOR"
          fi
          xcodebuild \
            -project iOSAgentSandbox.xcodeproj \
            -scheme iOSAgentSandbox \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            build | tee build.log | tail -n 40

      - name: เซ็นด้วย ldid และแพ็คเป็น .ipa
        env:
          PROJECT_DIR: ${{ steps.source.outputs.dir }}
        run: cd "$PROJECT_DIR" && bash Scripts/sign-and-package.sh

      - name: อัปโหลด artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSAgentSandbox-ipa
          path: ${{ steps.source.outputs.dir }}/build-artifacts/iOSAgentSandbox.ipa
          if-no-files-found: error

      - name: เผยแพร่ขึ้น Releases (ลิงก์โหลดถาวร)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_DIR: ${{ steps.source.outputs.dir }}
        run: |
          set -euo pipefail
          TAG="latest-build"
          NOTES="บิลด์อัตโนมัติจาก commit ${GITHUB_SHA::7} • เซ็นด้วย ldid + entitlements no-sandbox"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --title "Latest build (auto)" --notes "$NOTES"
          fi
          gh release upload "$TAG" "$PROJECT_DIR/build-artifacts/iOSAgentSandbox.ipa" --clobber
          {
            echo "## ดาวน์โหลด .ipa"
            echo ""
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/iOSAgentSandbox.ipa"
          } >> "$GITHUB_STEP_SUMMARY"
