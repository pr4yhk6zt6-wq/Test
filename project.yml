# XcodeGen spec — ใช้สร้าง iOSAgentSandbox.xcodeproj
#
# ทำไมต้องมีไฟล์นี้: ตัว .xcodeproj (ไฟล์ pbxproj) ถูก generate จากสเปกนี้ เพื่อให้โครงสร้างโปรเจกต์
# ตรงกับซอร์สโค้ดเสมอและไม่เพี้ยนจากการ merge
#
# วิธีใช้บนเครื่อง Mac (หรือใน GitHub Actions):
#   brew install xcodegen
#   cd iOSAgentSandbox
#   xcodegen generate
#   open iOSAgentSandbox.xcodeproj
name: iOSAgentSandbox

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  xcodeVersion: "15.0"

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "5.0"
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    ENABLE_BITCODE: NO
    ENABLE_MODULE_VERIFIER: NO
    ONLY_ACTIVE_ARCH: NO
    GCC_C_LANGUAGE_STANDARD: gnu11
    CLANG_ENABLE_OBJC_ARC: YES

targets:
  iOSAgentSandbox:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: App
      - path: Models
      - path: Services
      - path: Views
      - path: Resources
        excludes:
          - "Info.plist"
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.example.iosagentsandbox
        PRODUCT_NAME: iOSAgentSandbox
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # ไม่ตั้ง CODE_SIGN_ENTITLEMENTS ที่นี่ เพราะ entitlements ของแอปนี้ไม่มี provisioning profile
        # รองรับ — CI/Build จะเซ็นเองด้วย ldid -S (ดู Entitlements/iOSAgentSandbox.entitlements)

schemes:
  iOSAgentSandbox:
    build:
      targets:
        iOSAgentSandbox: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
